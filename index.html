<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Мои задачи</h1>
    <form id="todo-form">
      <label for="todo-input">Добавить новую задачу</label>
      <input type="text" id="todo-input" placeholder="Задача">
      <button type="submit" id="todo-btn" class="todo-btn">Добавить</button>
    </form>
    <ul id="todo-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
